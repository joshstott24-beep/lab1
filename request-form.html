<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Tutoring Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>

        <nav class="mb-3">
            <a href="index.html">Home</a> |
            <a href="tutors.html">View tutors</a>
        </nav>

        <form class="request-form" action="process-request.php" method="post">
            <div class="row g-3">
                <div class="col-12 col-md-7">
                    <label for="course" class="form-label">Course</label>
                    <input id="course" name="course" type="text" class="form-control" required>
                </div>

                <div class="col-12 col-md-5">
                    <label for="date" class="form-label">Preferred date</label>
                    <input id="date" name="date" type="date" class="form-control" required>
                </div>
            </div>

            <button class="btn btn-danger mt-3" type="submit">Request Session</button>
        </form>
    </main>
</body>

</html>
